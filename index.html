<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#eaf6ff"><title>Sbewo — Telegram Mini App</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script>
/* Apply saved/system Telegram theme before the first stylesheet is painted. */
(function(){
 'use strict';
 var key='sbewo-appearance', root=document.documentElement, choice='system';
 try {var saved=localStorage.getItem(key);if(['light','dark','system'].includes(saved))choice=saved;}catch(e){}
 function darkSystem(){
  var telegram=window.Telegram&&window.Telegram.WebApp;
  if(telegram&&['light','dark'].includes(telegram.colorScheme))return telegram.colorScheme==='dark';
  return !!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
 }
 function paint(){
  var active=choice==='system'?(darkSystem()?'dark':'light'):choice;
  root.dataset.sbewoTheme=active;
  root.style.colorScheme=active;
  var meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=active==='dark'?'#0B1120':'#eaf6ff';
  try {var t=window.Telegram&&window.Telegram.WebApp;if(t){t.setHeaderColor(active==='dark'?'#0B1120':'#eaf5ff');t.setBackgroundColor(active==='dark'?'#0B1120':'#f4f6f8');}}catch(e){}
 }
 var api={getChoice:function(){return choice;},setChoice:function(v){if(!['light','dark','system'].includes(v))return;choice=v;try{localStorage.setItem(key,choice)}catch(e){}paint();},refresh:paint};
 window.SbewoTheme=api;
 paint();
 var media=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');
 if(media){if(media.addEventListener)media.addEventListener('change',function(){if(choice==='system')paint();});else if(media.addListener)media.addListener(function(){if(choice==='system')paint();});}
 function connectTelegram(){var t=window.Telegram&&window.Telegram.WebApp;if(t){try{t.onEvent('themeChanged',function(){if(choice==='system')paint();});}catch(e){}if(choice==='system')paint();}}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',connectTelegram,{once:true});else connectTelegram();
})();
</script><link rel="icon" href="data:,"><script>
/* Only preload imagery for the actual entry screen; other mascots warm in idle time. */
try {
  const home = localStorage.getItem('sbewo-v8-onboarded') === 'yes' || localStorage.getItem('sbewo-v6-onboarded') === 'yes';
  const link = document.createElement('link');
  link.rel = 'preload'; link.as = 'image'; link.fetchPriority = 'high';
  link.href = home ? './kyu-home.webp' : './kyu-welcome.webp';
  document.head.appendChild(link);
} catch {}
</script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"><link rel="stylesheet" href="./style.css?v=105.0"><link rel="stylesheet" href="./theme-dark.css?v=1.0"><script src="./config.js"></script><script src="./app.js?v=106.0" defer></script><script>
/* Sbewo: touch-first Telegram Mini App interaction guards. */
(function () {
  'use strict';
  const editable = (target) => !!(target && target.closest && target.closest('input, textarea, [contenteditable=""], [contenteditable="true"], [role="textbox"]'));
  const stop = (event) => event.preventDefault();
  // Copy/cut and browser context menus should never be triggered by accidental touches.
  document.addEventListener('copy', stop, true);
  document.addEventListener('cut', stop, true);
  document.addEventListener('contextmenu', stop, true);
  document.addEventListener('dragstart', stop, true);
  document.addEventListener('selectstart', (event) => {
    if (!editable(event.target)) event.preventDefault();
  }, true);
  // On iOS, Safari zoom can be invoked by gestures and double tap.
  ['gesturestart', 'gesturechange', 'gestureend'].forEach((name) => {
    document.addEventListener(name, stop, { passive: false });
  });
  document.addEventListener('touchmove', (event) => {
    if (event.touches && event.touches.length > 1) event.preventDefault();
  }, { passive: false });
  document.addEventListener('dblclick', (event) => {
    if (!editable(event.target)) event.preventDefault();
  }, true);
  // Keyboard modifiers / trackpads can also change scale in desktop browsers.
  document.addEventListener('wheel', (event) => {
    if (event.ctrlKey || event.metaKey) event.preventDefault();
  }, { passive: false });
  document.addEventListener('keydown', (event) => {
    if (!(event.ctrlKey || event.metaKey)) return;
    const key = String(event.key || '').toLowerCase();
    if (key === 'c' || key === 'x' || key === '+' || key === '-' || key === '=' || key === '0') {
      event.preventDefault();
    }
  }, true);
})();
</script></head><body><div id="app"><div class="boot"><div class="loader"></div><strong>Открываем Sbewo…</strong></div></div></body></html>
