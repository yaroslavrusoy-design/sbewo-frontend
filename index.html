<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#eaf6ff"><title>Sbewo — Telegram Mini App</title><link rel="icon" href="data:,"><script>
/* Only preload imagery for the actual entry screen; other mascots warm in idle time. */
try {
  const home = localStorage.getItem('sbewo-v8-onboarded') === 'yes' || localStorage.getItem('sbewo-v6-onboarded') === 'yes';
  const link = document.createElement('link');
  link.rel = 'preload'; link.as = 'image'; link.fetchPriority = 'high';
  link.href = home ? './kyu-home.webp' : './kyu-welcome.webp';
  document.head.appendChild(link);
} catch {}
</script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"><script src="https://telegram.org/js/telegram-web-app.js"></script><script>
/* Load current Sbewo assets using their server revisions.
   Unchanged files retain their browser cache; a changed ETag gets a new URL. */
(function () {
  'use strict';
  const files = ['style.css', 'config.js', 'app.js'];
  const launchFallback = String(Date.now());
  let baseline = null;
  let checking = false;
  let lastCheck = 0;
  const checkInterval = 60 * 1000;

  async function revision(name) {
    const response = await fetch('./' + name, { method: 'HEAD', cache: 'no-store' });
    if (!response.ok) throw new Error('Unable to check ' + name);
    return response.headers.get('etag') || response.headers.get('last-modified') || null;
  }
  async function revisions() {
    return Promise.all(files.map(async name => {
      try { return await revision(name); }
      catch (_) { return null; }
    }));
  }
  function assetUrl(name, tag) {
    return './' + name + '?sbewo_rev=' + encodeURIComponent(tag || launchFallback);
  }
  function loadScript(name, tag) {
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = assetUrl(name, tag);
      script.async = false;
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }
  async function boot() {
    const tags = await revisions();
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = assetUrl(files[0], tags[0]);
    document.head.appendChild(css);
    await loadScript('config.js', tags[1]);
    await loadScript('app.js', tags[2]);
    baseline = tags;
  }
  boot().catch(() => {
    const root = document.getElementById('app');
    if (root) root.textContent = 'Не удалось загрузить Sbewo. Проверь подключение к интернету и открой приложение заново.';
  });

  // Check all three assets when returning to Sbewo, not app.js alone.
  async function checkForUpdate() {
    if (document.hidden || !baseline || checking || Date.now() - lastCheck < checkInterval) return;
    checking = true;
    lastCheck = Date.now();
    try {
      const current = await revisions();
      const changed = current.some((tag, i) => tag && baseline[i] && tag !== baseline[i]);
      if (changed) window.location.reload();
    } finally { checking = false; }
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) void checkForUpdate();
  });
  window.addEventListener('focus', () => { void checkForUpdate(); });
})();
</script><script>
/* Sbewo: touch-first Telegram Mini App interaction guards. */
(function () {
  'use strict';
  const editable = (target) => !!(target && target.closest && target.closest('input, textarea, [contenteditable=""], [contenteditable="true"], [role="textbox"]'));
  const stop = (event) => event.preventDefault();
  // Allow copying and cutting text in Sbewo (snippets, event details, form inputs).
  document.addEventListener('contextmenu', stop, true);
  document.addEventListener('dragstart', stop, true);
  document.addEventListener('selectstart', (event) => {
    if (!editable(event.target)) event.preventDefault();
  }, true);
  // On iOS, Safari zoom can be invoked by gestures and double tap.
  ['gesturestart', 'gesturechange', 'gestureend'].forEach((name) => {
    document.addEventListener(name, stop, { passive: false });
  });
  document.addEventListener('touchmove', (event) => {
    if (event.touches && event.touches.length > 1) event.preventDefault();
  }, { passive: false });
  document.addEventListener('dblclick', (event) => {
    if (!editable(event.target)) event.preventDefault();
  }, true);
  // Keyboard modifiers / trackpads can also change scale in desktop browsers.
  document.addEventListener('wheel', (event) => {
    if (event.ctrlKey || event.metaKey) event.preventDefault();
  }, { passive: false });
  document.addEventListener('keydown', (event) => {
    if (!(event.ctrlKey || event.metaKey)) return;
    const key = String(event.key || '').toLowerCase();
    if (key === '+' || key === '-' || key === '=' || key === '0') {
      event.preventDefault();
    }
  }, true);
})();
</script></head><body><div id="app"><div class="boot"><div class="loader"></div><strong>Открываем Sbewo…</strong></div></div></body></html>
